<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/signin.css">
</head>
<body>
    <a><img class="logo" src="./images/Novalogo.jpg" alt="" width="100px"></a>
    <div class="signin-container">

    <h1 class="signin-title">Sign Up</h1>

    <form id="signupForm">

        <h5 class="input-lable">Your Name</h5>

        <input type="text"
               id="name"
               placeholder="First And Last Name"
               required>

        <h5 class="input-lable">
            Mobile Number Or Email
        </h5>

        <input type="text"
               id="email"
               required>

        <h5 class="input-lable">Password</h5>

        <input type="password"
               id="password"
               placeholder="At Least 6 Characters"
               required>

        <button type="submit">Continue</button>

    </form>

    <p class="signin-condition">
        By Continuing, you agree to Nova's
        <span>Conditions of Use</span> and
        <span>Privacy Notice.</span>
    </p>

    <p class="signin-help">
        &#9656 <span>Need Help</span>
    </p>

    <hr>

    <h4>Buying for work?</h4>

    <p class="signin-business">
        <span>Shop on Nova Business</span>
    </p>

</div>
    
    <a href="/signin.html">
    <button class="signin-singup-btn">Login with Nova account</button>
    </a>

    <footer>
        <div class="footer-links">
            <a href="#">Conditions Of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p class="footer-copyright">@2000-2026, Nova.com, Inc. or its affiliates</p>
    </footer>
</body>

<script>

document.getElementById("signupForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    let name =
    document.getElementById("name").value;

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    if(name.trim() === "" ||
       email.trim() === "" ||
       password.trim() === ""){

        alert("Please fill all fields");

    }

    else if(password.length < 6){

        alert("Password must be at least 6 characters");

    }

    else{

        alert("Account Created Successfully!");

        window.location.href = "index.html";

    }

});

</script>
</html>
